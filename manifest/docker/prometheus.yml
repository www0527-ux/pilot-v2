global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  # Host go run (Docker Desktop / host-gateway)
  - job_name: 'pilot-host'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
  # Compose app profile (service name on pilot-network)
  - job_name: 'pilot'
    metrics_path: /metrics
    static_configs:
      - targets: ['pilot:8080']
  # Optional real-request demo. Its metrics use pilot_demo_* to keep existing
  # Pilot alerts/dashboards separate. These targets are down when not started.
  - job_name: 'pilot-slow-demo'
    static_configs:
      - targets: ['host.docker.internal:18091']
        labels:
          service: pilot-demo-gateway
      - targets: ['host.docker.internal:18092']
        labels:
          service: pilot-demo-inventory
